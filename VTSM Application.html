                      <select 
                        value={productFilter}
                        onChange={(e) => setProductFilter(e.target.value)}
                        class="px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="">{t.allProducts}</option>
                        {PRODUCT_TYPES.map(pt => (
                          <option key={pt} value={pt}>{pt}</option>
                        ))}
                      </select>

                      <!-- CSV Export -->
                      <button 
                        onClick={exportToCSV}
                        class="px-3 py-2 text-sm bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium rounded-lg transition flex items-center justify-center space-x-1"
                      >
                        <span>📥</span>
                        <span>{t.exportData}</span>
                      </button>

                    </div>
                  </div>

                  <!-- Service Tickets Table -->
                  <div class="mt-6 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                    <div class="overflow-x-auto">
                      <table class="w-full text-left border-collapse">
                        <thead>
                          <tr class="bg-slate-50 dark:bg-slate-700/50 text-xs font-semibold text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700 uppercase tracking-wider">
                            <th class="p-4">{t.ticketId}</th>
                            <th class="p-4">{t.customer}</th>
                            <th class="p-4">{t.product}</th>
                            <th class="p-4">{t.status}</th>
                            <th class="p-4">{t.priority}</th>
                            <th class="p-4">{t.assignedTo}</th>
                            <th class="p-4 text-right">{t.actions}</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 dark:divide-slate-700 text-sm">
                          {filteredTickets.length > 0 ? (
                            filteredTickets.map(ticket => (
                              <tr key={ticket.id} class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30 transition">
                                <td class="p-4 font-bold text-blue-600 dark:text-blue-400">{ticket.id}</td>
                                <td class="p-4">
                                  <div class="font-medium text-slate-900 dark:text-white">{ticket.customerName}</div>
                                  <div class="text-xs text-slate-400">{ticket.contact}</div>
                                </td>
                                <td class="p-4">
                                  <div class="text-slate-800 dark:text-slate-200 font-medium">{ticket.productType}</div>
                                  <div class="text-xs text-slate-400">S/N: {ticket.serialNo}</div>
                                </td>
                                <td class="p-4">
                                  <span class={`px-2.5 py-1 rounded-full text-xs font-semibold ${
                                    ticket.status === 'Open' ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-400' :
                                    ticket.status === 'In Progress' ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400' :
                                    ticket.status === 'Pending Parts' ? 'bg-purple-100 text-purple-800 dark:bg-purple-900/30 dark:text-purple-400' :
                                    'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-400'
                                  }`}>
                                    {ticket.status}
                                  </span>
                                </td>
                                <td class="p-4">
                                  <span class={`text-xs font-semibold ${
                                    ticket.priority === 'Critical' ? 'text-rose-600 dark:text-rose-400 font-bold' :
                                    ticket.priority === 'High' ? 'text-orange-500' : 'text-slate-500'
                                  }`}>
                                    {ticket.priority}
                                  </span>
                                </td>
                                <td class="p-4 text-slate-600 dark:text-slate-300">{ticket.assignedTo}</td>
                                <td class="p-4 text-right">
                                  <button 
                                    onClick={() => {
                                      const nextStatus = ticket.status === 'Open' ? 'In Progress' : ticket.status === 'In Progress' ? 'Resolved' : 'Closed';
                                      setTickets(tickets.map(item => item.id === ticket.id ? {...item, status: nextStatus} : item));
                                    }}
                                    class="text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-2.5 py-1 rounded font-medium text-slate-700 dark:text-slate-200 transition"
                                  >
                                    Advance Status
                                  </button>
                                </td>
                              </tr>
                            ))
                          ) : (
                            <tr>
                              <td colSpan="7" class="p-8 text-center text-slate-400">
                                No service records found matching your criteria.
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* Forward Tracking Section */}
              {activeTab === 'forward' && (
                <div class="space-y-4">
                  <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-900 dark:text-white">{t.forwardTrackingTitle}</h2>
                    <button 
                      onClick={() => setIsFTModalOpen(true)}
                      class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-4 py-2 rounded-lg shadow transition"
                    >
                      + {t.logTransfer}
                    </button>
                  </div>

                  <div class="grid grid-cols-1 gap-4">
                    {forwardLogs.map(log => (
                      <div key={log.id} class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                          <div class="flex items-center space-x-2">
                            <span class="font-bold text-blue-600 dark:text-blue-400">{log.id}</span>
                            <span class="font-semibold text-slate-900 dark:text-white">{log.partName}</span>
                          </div>
                          <p class="text-xs text-slate-500 dark:text-slate-400">
                            Source: <span class="font-mono bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded text-slate-800 dark:text-slate-200">{log.sourceSN}</span> 
                            ➡️ Target: <span class="font-mono bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded text-slate-800 dark:text-slate-200">{log.targetSN}</span>
                          </p>
                          <p class="text-xs text-slate-600 dark:text-slate-400 italic">"{log.notes}"</p>
                        </div>
                        <div class="text-right text-xs text-slate-400">
                          <div>Logged by: <span class="font-medium text-slate-700 dark:text-slate-300">{log.transferredBy}</span></div>
                          <div>Date: {log.date}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Analytics Tab */}
              {activeTab === 'analytics' && (
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Ticket Status Breakdown</h3>
                    <div class="space-y-3">
                      {['Open', 'In Progress', 'Pending Parts', 'Resolved'].map(st => {
                        const count = tickets.filter(t => t.status === st).length;
                        const pct = tickets.length ? Math.round((count / tickets.length) * 100) : 0;
                        return (
                          <div key={st} class="space-y-1">
                            <div class="flex justify-between text-xs font-medium">
                              <span class="text-slate-700 dark:text-slate-300">{st}</span>
                              <span class="text-slate-500">{count} ({pct}%)</span>
                            </div>
                            <div class="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                              <div class="bg-blue-600 h-full rounded-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4">Top Product Issues</h3>
                    <ul class="divide-y divide-slate-100 dark:divide-slate-700 text-sm">
                      {PRODUCT_TYPES.slice(0,4).map((pt, i) => (
                        <li key={pt} class="py-2.5 flex justify-between items-center">
                          <span class="text-slate-800 dark:text-slate-200 font-medium">{pt}</span>
                          <span class="bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded-full text-xs font-bold">
                            {tickets.filter(t => t.productType === pt).length} Logged
                          </span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              )}

            </main>
          </div>

          <!-- Create Ticket Modal -->
          {isModalOpen && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-3">
                  <h3 class="text-lg font-bold text-slate-900 dark:text-white">{t.createNewTicket}</h3>
                  <button onClick={() => setIsModalOpen(false)} class="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <form onSubmit={handleCreateTicket} class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.customerName}</label>
                    <input type="text" required value={newTicketData.customerName} onChange={e => setNewTicketData({...newTicketData, customerName: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500" />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.contactNumber}</label>
                      <input type="text" required value={newTicketData.contact} onChange={e => setNewTicketData({...newTicketData, contact: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.email}</label>
                      <input type="email" value={newTicketData.email} onChange={e => setNewTicketData({...newTicketData, email: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.productType}</label>
                    <select value={newTicketData.productType} onChange={e => setNewTicketData({...newTicketData, productType: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500">
                      {PRODUCT_TYPES.map(pt => <option key={pt} value={pt}>{pt}</option>)}
                    </select>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.modelNo}</label>
                      <input type="text" required value={newTicketData.modelNo} onChange={e => setNewTicketData({...newTicketData, modelNo: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.serialNo}</label>
                      <input type="text" required value={newTicketData.serialNo} onChange={e => setNewTicketData({...newTicketData, serialNo: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.issueDescription}</label>
                    <textarea rows="3" required value={newTicketData.issue} onChange={e => setNewTicketData({...newTicketData, issue: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                  </div>
                  <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} class="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg font-medium">{t.cancel}</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow">{t.submit}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <!-- Create Forward Tracking Log Modal -->
          {isFTModalOpen && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl max-w-lg w-full p-6 space-y-4 border border-slate-200 dark:border-slate-700">
                <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-700 pb-3">
                  <h3 class="text-lg font-bold text-slate-900 dark:text-white">{t.logTransfer}</h3>
                  <button onClick={() => setIsFTModalOpen(false)} class="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <form onSubmit={handleCreateLog} class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.partName}</label>
                    <input type="text" required value={newLogData.partName} onChange={e => setNewLogData({...newLogData, partName: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500" />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.sourceSN}</label>
                      <input type="text" required value={newLogData.sourceSN} onChange={e => setNewLogData({...newLogData, sourceSN: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{t.targetSN}</label>
                      <input type="text" required value={newLogData.targetSN} onChange={e => setNewLogData({...newLogData, targetSN: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">Transfer Notes</label>
                    <textarea rows="2" value={newLogData.notes} onChange={e => setNewLogData({...newLogData, notes: e.target.value})} class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                  </div>
                  <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsFTModalOpen(false)} class="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg font-medium">{t.cancel}</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow">{t.submit}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <!-- Footer -->
          <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-4 text-center text-xs text-slate-500">
            Vibin Technoproducts Service Management System &copy; 2026. All rights reserved.
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
